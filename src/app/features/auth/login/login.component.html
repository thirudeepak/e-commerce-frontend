<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="auth-logo"><i class="fa-solid fa-cart-shopping"></i></div>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to your NexusMarket account</p>
    </div>

    <!-- One-Click Demo Accounts -->
    <div class="demo-logins">
      <span class="demo-label">Quick Demo Access (Click to auto-fill & login):</span>
      <div class="demo-grid">
        <button class="demo-btn admin-badge" (click)="quickLogin('admin@ecommerce.com', 'Password123!')">
          <i class="fa-solid fa-shield-halved"></i> Admin
        </button>
        <button class="demo-btn seller1-badge" (click)="quickLogin('seller1@ecommerce.com', 'Password123!')">
          <i class="fa-solid fa-store"></i> Seller 1 (Apex)
        </button>
        <button class="demo-btn seller2-badge" (click)="quickLogin('seller2@ecommerce.com', 'Password123!')">
          <i class="fa-solid fa-store"></i> Seller 2 (Prime)
        </button>
        <button class="demo-btn user-badge" (click)="quickLogin('alice@ecommerce.com', 'Password123!')">
          <i class="fa-solid fa-user"></i> Customer Alice
        </button>
        <button class="demo-btn user-badge" (click)="quickLogin('bob@ecommerce.com', 'Password123!')">
          <i class="fa-solid fa-user"></i> Customer Bob
        </button>
      </div>
    </div>

    <div class="auth-divider"><span>OR ENTER CREDENTIALS</span></div>

    <form (ngSubmit)="onLogin()" class="auth-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          class="input-field"
          placeholder="you@example.com"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="input-field"
          placeholder="••••••••"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
        @if (isLoading) {
          <i class="fa-solid fa-spinner fa-spin"></i> Signing in...
        } @else {
          Sign In <i class="fa-solid fa-arrow-right"></i>
        }
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a routerLink="/register" class="auth-link">Create Account</a>
    </div>
  </div>
</div>
