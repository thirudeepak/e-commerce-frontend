<div class="toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast-item" [ngClass]="'toast-' + toast.type">
      <div class="toast-icon">
        @if (toast.type === 'success') { <i class="fa-solid fa-circle-check"></i> }
        @if (toast.type === 'error') { <i class="fa-solid fa-circle-exclamation"></i> }
        @if (toast.type === 'info') { <i class="fa-solid fa-circle-info"></i> }
      </div>
      <div class="toast-message">{{ toast.text }}</div>
      <button class="toast-close" (click)="toastService.remove(toast.id)">&times;</button>
    </div>
  }
</div>
